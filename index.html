<!DOCTYPE html>
<html lang="en" class="dark" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ATELIER.UI — Quiet Luxury Component System</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Distinctive Display Fonts (Syne & Plus Jakarta Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">

  <!-- Phosphor Icons (Official Icon Standard) -->
  <link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />

  <!-- Custom Theme & Playground Styles -->
  <link rel="stylesheet" href="css/theme.css?v=20261003m">
  <link rel="stylesheet" href="css/playground.css?v=20261003m">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        screens: {
          'xs': '360px',
          'sm': '640px',
          'md': '768px',
          'lg': '1024px',
          'xl': '1280px',
        },
        extend: {
          colors: {
            surface: {
              bg: 'var(--bg-app)',
              card: 'var(--bg-card)',
              elevated: 'var(--bg-surface)',
              hover: 'var(--bg-surface-hover)',
              active: 'var(--bg-surface-active)',
              input: 'var(--bg-input)',
            },
            luxury: {
              primary: 'var(--text-primary)',
              secondary: 'var(--text-secondary)',
              muted: 'var(--text-muted)',
              border: 'var(--border-hairline)',
              accent: 'var(--accent-peach)',
            },
            accent: {
              peach: 'var(--accent-peach)',
              amber: 'var(--accent-amber)',
              emerald: 'var(--accent-emerald)',
              indigo: 'var(--accent-indigo)',
            }
          },
          fontFamily: {
            display: ['Syne', 'sans-serif'],
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'SF Mono', 'Menlo', 'monospace'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-surface-bg text-luxury-primary antialiased min-h-screen flex flex-col transition-colors duration-300 overflow-x-hidden">

  <!-- Unified Elevated Glass Header & Navigation Deck -->
  <header class="playground-sticky-shell">
    <!-- Top tier: Brand, Search, Theme Toggle with edge-to-edge alignment -->
    <div class="w-full px-4 sm:px-6 lg:px-8 pt-3.5 sm:pt-4 pb-2.5 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <div class="flex flex-col min-w-0">
          <a href="#" class="font-display font-extrabold tracking-[-0.035em] text-lg sm:text-xl text-luxury-primary uppercase leading-tight select-none truncate hover:opacity-90 transition-opacity">
            ATELIER<span class="text-luxury-accent">.</span>UI
          </a>
          <p class="hidden xs:block text-[10px] sm:text-[11px] text-luxury-secondary truncate">Quiet Luxury Component System</p>
        </div>
      </div>

      <!-- Search bar & actions -->
      <div class="flex items-center gap-2 sm:gap-3 shrink-0">
        <div class="relative hidden md:block w-56 lg:w-64">
          <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-luxury-muted text-sm"></i>
          <input id="search-components" type="text" placeholder="Filter elements... (⌘K)" class="w-full pl-8 pr-12 py-1.5 bg-surface-elevated border border-luxury-border rounded-lg text-xs text-luxury-primary placeholder-luxury-muted focus:outline-none focus:border-luxury-accent transition-all duration-200" />
          <span id="search-count" class="absolute right-2 top-1/2 -translate-y-1/2 text-[10px] font-mono text-luxury-muted"></span>
        </div>

        <!-- Theme Switcher Button -->
        <button id="theme-toggle-btn" class="btn-luxury btn-luxury-secondary text-xs px-3 py-1.5 shrink-0" title="Toggle Theme (T)">
          <i class="ph ph-sun text-base"></i>
          <span class="hidden sm:inline">Light Mode</span>
        </button>
      </div>
    </div>

    <!-- Mobile Bottom tier: Smooth touch-scroll category pill strip -->
    <div class="lg:hidden border-t border-[var(--border-hairline)] px-4 sm:px-6 py-2 overflow-x-auto scrollbar-none">
      <nav id="category-nav-mobile" class="flex items-center gap-1.5 sm:gap-2 min-w-max w-full">
        <!-- Injected dynamically by core.js on mobile -->
      </nav>
    </div>
  </header>

  <!-- Main Workspace Layout (Edge-to-Edge: Left Nav + Central Feed + Right Inspector) -->
  <div class="flex-1 w-full px-3 sm:px-6 lg:px-8 py-4 flex gap-4 xl:gap-6 min-h-[calc(100vh-70px)]">
    
    <!-- LEFT SIDEBAR: Desktop Controls & Category Navigation -->
    <aside class="hidden lg:flex flex-col w-64 shrink-0 sticky top-[76px] h-[calc(100vh-92px)] bg-surface-card border border-[var(--border-hairline)] rounded-2xl p-4 overflow-hidden">
      <div class="flex items-center justify-between pb-3 mb-3 border-b border-[var(--border-hairline)]">
        <span class="text-xs font-semibold text-luxury-primary tracking-wide uppercase">Navigation</span>
        <span id="desktop-total-count" class="text-[10px] font-mono px-2 py-0.5 rounded-full bg-surface-elevated text-luxury-muted"></span>
      </div>

      <!-- Desktop Sidebar Search -->
      <div class="relative mb-3">
        <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-luxury-muted text-sm"></i>
        <input id="search-components-sidebar" type="text" placeholder="Search... (⌘K)" class="w-full pl-8 pr-3 py-1.5 bg-surface-elevated border border-luxury-border rounded-lg text-xs text-luxury-primary placeholder-luxury-muted focus:outline-none focus:border-luxury-accent transition-all" />
      </div>

      <!-- Navigation Links Injected here -->
      <nav id="category-nav-desktop" class="flex-1 overflow-y-auto space-y-1 pr-1 sidebar-scroll">
        <!-- Injected dynamically by core.js -->
      </nav>
    </aside>

    <!-- CENTER AREA: Playground Content -->
    <main class="flex-1 min-w-0 overflow-x-hidden">
      <div id="playground-content" class="space-y-8 sm:space-y-12">
        <!-- Modules populate here dynamically -->
      </div>
    </main>

    <!-- RIGHT SIDEBAR: Inspector (Active Component Code & Accent Customizer) -->
    <aside id="inspector-sidebar" class="hidden xl:flex flex-col w-80 shrink-0 sticky top-[76px] h-[calc(100vh-92px)] bg-surface-card border border-[var(--border-hairline)] rounded-2xl p-4 overflow-hidden">
      <!-- Header -->
      <div class="flex items-center justify-between pb-3 mb-3 border-b border-[var(--border-hairline)]">
        <div class="flex items-center gap-2">
          <i class="ph ph-sliders text-sm text-[var(--active-accent,var(--accent-peach))]"></i>
          <span class="text-xs font-semibold text-luxury-primary tracking-wide uppercase">Inspector</span>
        </div>
        <span id="inspector-status-badge" class="text-[10px] font-mono px-2 py-0.5 rounded-full bg-surface-elevated text-luxury-muted">Ready</span>
      </div>

      <!-- Color Palette Customizer Section -->
      <div class="mb-4 pb-3 border-b border-[var(--border-hairline)]">
        <div class="flex items-center justify-between mb-2">
          <span class="text-[11px] font-medium text-luxury-secondary">Accent Color</span>
          <span id="current-accent-label" class="text-[10px] font-mono text-[var(--active-accent,var(--accent-peach))]">Warm Peach</span>
        </div>
        <div class="grid grid-cols-6 gap-1.5" id="accent-swatches">
          <!-- Swatches dynamically generated or static -->
          <button data-color="#FFC799" data-name="Peach" class="accent-swatch-btn w-7 h-7 rounded-lg bg-[#FFC799] border-2 border-white/60 hover:scale-105 transition-all shadow-sm" title="Warm Peach"></button>
          <button data-color="#F2C94C" data-name="Amber" class="accent-swatch-btn w-7 h-7 rounded-lg bg-[#F2C94C] border border-transparent hover:scale-105 transition-all shadow-sm" title="Studio Amber"></button>
          <button data-color="#10B981" data-name="Emerald" class="accent-swatch-btn w-7 h-7 rounded-lg bg-[#10B981] border border-transparent hover:scale-105 transition-all shadow-sm" title="Emerald"></button>
          <button data-color="#818CF8" data-name="Indigo" class="accent-swatch-btn w-7 h-7 rounded-lg bg-[#818CF8] border border-transparent hover:scale-105 transition-all shadow-sm" title="Indigo"></button>
          <button data-color="#FB7185" data-name="Rose" class="accent-swatch-btn w-7 h-7 rounded-lg bg-[#FB7185] border border-transparent hover:scale-105 transition-all shadow-sm" title="Rose"></button>
          <button data-color="#38BDF8" data-name="Cyan" class="accent-swatch-btn w-7 h-7 rounded-lg bg-[#38BDF8] border border-transparent hover:scale-105 transition-all shadow-sm" title="Sky Cyan"></button>
        </div>
      </div>

      <!-- Active Component Code Panel -->
      <div class="flex-1 flex flex-col min-h-0">
        <div class="flex items-center justify-between mb-2">
          <div class="min-w-0 pr-2">
            <h4 id="inspector-comp-title" class="text-xs font-semibold text-luxury-primary truncate">Select a component</h4>
            <p id="inspector-comp-sub" class="text-[10px] text-luxury-muted truncate">Click any card to inspect code</p>
          </div>
          <button id="inspector-copy-btn" class="btn-luxury btn-luxury-secondary text-[11px] px-2 py-1 shrink-0" title="Copy Code">
            <i class="ph ph-copy text-xs"></i>
            <span>Copy</span>
          </button>
        </div>

        <div class="flex-1 bg-surface-elevated rounded-xl border border-[var(--border-hairline)] p-2.5 overflow-hidden flex flex-col">
          <pre class="flex-1 overflow-auto text-[11px] font-mono leading-relaxed sidebar-scroll whitespace-pre-wrap"><code id="inspector-code-block">&lt;!-- Click any component to preview and copy its HTML snippet here --&gt;</code></pre>
        </div>
      </div>
    </aside>

  </div>

  <!-- Footer -->
  <footer class="mt-auto border-t border-luxury-border px-4 sm:px-6 lg:px-8 py-5 text-center text-xs text-luxury-muted transition-colors duration-300">
    <div class="w-full flex flex-col sm:flex-row items-center justify-between gap-2.5">
      <span class="font-display font-bold tracking-tight text-luxury-secondary">ATELIER.UI</span>
      <span class="font-mono text-[10px] sm:text-[11px] text-luxury-muted">Phosphor Icons &bull; Zero Emojis &bull; Hairline Micro-Surfaces</span>
    </div>
  </footer>

  <!-- Code Preview Modal -->
  <div id="code-modal" class="modal-backdrop">
    <div class="modal-panel max-w-[calc(100vw-20px)] sm:max-w-2xl">
      <div class="flex items-center justify-between px-4 sm:px-5 py-3 border-b border-luxury-border">
        <div class="flex items-center gap-2 text-xs font-medium text-luxury-primary truncate">
          <i class="ph ph-code text-sm text-luxury-accent shrink-0"></i>
          <span id="modal-title" class="truncate">Component Code</span>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <button id="modal-copy-btn" class="btn-luxury btn-luxury-secondary text-xs py-1 px-2.5">
            <i class="ph ph-copy text-xs"></i>
            <span class="hidden xs:inline">Copy Snippet</span>
          </button>
          <button id="modal-close-btn" class="p-1 rounded-lg text-luxury-muted hover:text-luxury-primary hover:bg-surface-elevated transition-colors">
            <i class="ph ph-x text-base"></i>
          </button>
        </div>
      </div>
      <div class="p-3 sm:p-5 overflow-y-auto max-h-[60vh]">
        <pre class="text-[11px] sm:text-xs font-mono text-luxury-secondary bg-surface-elevated p-3 sm:p-4 rounded-xl border border-luxury-border whitespace-pre-wrap selection:bg-luxury-accent selection:text-black overflow-x-auto"><code id="modal-code"></code></pre>
      </div>
    </div>
  </div>

  <!-- Toast Container (mobile bottom safe area) -->
  <div id="toast-container"></div>

  <!-- Modular Scripts Architecture with Cache Busting -->
  <script src="js/core.js?v=20261003p"></script>
  <script src="js/modules/buttons.js?v=20261003p"></script>
  <script src="js/modules/inputs.js?v=20261003p"></script>
  <script src="js/modules/cards.js?v=20261003p"></script>
  <script src="js/modules/navigation.js?v=20261003p"></script>
  <script src="js/modules/tables.js?v=20261003p"></script>
  <script src="js/modules/feedback.js?v=20261003p"></script>
  <script src="js/modules/visualizations.js?v=20261003p"></script>
  <script src="js/modules/hardware.js?v=20261003p"></script>
  <script src="js/app.js?v=20261003p"></script>
</body>
</html>
